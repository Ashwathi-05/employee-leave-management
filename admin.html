<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="logo">
            Leave Management System
        </div>

        <div class="nav-links">

            <a href="index.html">
                Employee
            </a>

            <a href="admin.html">
                Admin
            </a>

        </div>

    </nav>

    <main class="dashboard">

        <h1>Admin Dashboard</h1>

        <p class="subtitle">
            Manage employee leave requests
        </p>

        <button
            class="load-btn"
            onclick="loadLeaves()">
            Load Requests
        </button>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Employee Name</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="leaveTable">

                </tbody>

            </table>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
